name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Every job here also runs on demand from the Actions tab; nothing is dispatch-only.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # This step is also the public-API drift gate. Every packable project declares its surface in
      # PublicAPI.Shipped.txt/PublicAPI.Unshipped.txt (Microsoft.CodeAnalysis.PublicApiAnalyzers,
      # wired centrally in Directory.Build.targets); an undeclared public member reports RS0016 and
      # a declared-but-missing one RS0017, both of which fail this build under
      # TreatWarningsAsErrors. See CLAUDE.md, "The public API is declared, not inferred".
      - name: Build framework packages (also enforces public-API baselines)
        run: dotnet build Affiant.slnx -c Release

      - name: Run framework tests
        run: dotnet test Affiant.slnx -c Release --no-build

      - name: Pack framework packages
        run: dotnet pack Affiant.slnx -c Release -o ./nupkgs

      # The sample host and its test project are in the solution but marked IsPackable=false, so
      # this count is still the ten framework packages and nothing else.
      - name: Check 10 packages produced
        run: |
          count=$(ls ./nupkgs/*.nupkg | wc -l)
          echo "Produced $count packages"
          [ "$count" -eq 10 ] || (echo "Expected 10 packages, got $count" && exit 1)

  # The quickstart sample's own tests and its browser deck: the affidavit projection, the
  # development seam's filing path, the expiry transition, the seam's environment gate, how a
  # proposal's values are graded — then the eight behaviours the review lifecycle is locked by, in a
  # browser, against a host this job starts. Its own job so a sample failure reads as a sample
  # failure rather than as a framework one.
  #
  # The deck ran on `workflow_dispatch` only until 1.0.0-beta.3.1, on the argument that two of its
  # specs wait out the framework's 30-second expiry sweep and are a poor gate for an unrelated push.
  # What that bought was a deck nobody ran: one spec had been failing since the docket stores began
  # projecting expiry onto every read, and the 1.0.0-beta.3 tag was green anyway (affiant#111). It
  # runs in this job, on the triggers declared above — a push to main, a pull request based on main,
  # and a manual dispatch — so a commit green on main is one the deck passed. The specs that wait on
  # the sweep are why this job is minutes rather than seconds.
  sample-quickstart-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the quickstart sample host
        run: dotnet test samples/quickstart-host/tests/QuickstartHost.Tests/QuickstartHost.Tests.csproj -c Release

      - name: Build the sample host
        run: dotnet build samples/quickstart-host/QuickstartHost.csproj -c Release

      - name: Install the deck's dependencies
        working-directory: samples/quickstart-host
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the sample host
        working-directory: samples/quickstart-host
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5077
        run: |
          rm -f ./*.db ./*.db-shm ./*.db-wal
          nohup dotnet run --project QuickstartHost.csproj -c Release --no-build > host.log 2>&1 &
          echo $! > host.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5077/api/employees > /dev/null; then
              echo "host is up"; exit 0
            fi
            sleep 1
          done
          echo "host did not start"; cat host.log; exit 1

      - name: Run the review-lifecycle deck
        working-directory: samples/quickstart-host
        env:
          BASE_URL: http://localhost:5077
        run: npm run test:e2e

      - name: Stop the sample host
        if: always()
        working-directory: samples/quickstart-host
        run: kill "$(cat host.pid)" || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: quickstart-host-deck
          path: |
            samples/quickstart-host/playwright-report/
            samples/quickstart-host/test-results/
            samples/quickstart-host/host.log
          retention-days: 7

  # The compliance harness as an ADOPTER gets it. The driver ships in
  # Affiant.Testing.ComplianceHarness so a host can run the rulebook's suite against its own wiring;
  # this job is the only check that exercises that claim the way a host does — from the packed
  # package, restored from a local feed, with the rulebook in a directory that is deliberately NOT
  # beside the assembly.
  #
  # It exists because that claim was once false in a way nothing else could see: the package read
  # its schemas from a copy of the rulebook beside its own assembly, so the whole surface worked in
  # this repository (where the test project's build puts one there) and threw for everybody else.
  # A project reference cannot catch that. A packed package restored from a feed can.
  harness-consumer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack the release to a local feed
        run: dotnet pack Affiant.slnx -c Release -o "$RUNNER_TEMP/feed"

      - name: Read the version the tree builds
        id: version
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          suffix=$(sed -n 's:.*<VersionSuffix>\(.*\)</VersionSuffix>.*:\1:p' Directory.Build.props | head -1)
          version="$prefix${suffix:+-$suffix}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packing produced:"; ls "$RUNNER_TEMP/feed"

      # Every Affiant package comes from the local feed and nothing else — a restore that could
      # reach nuget.org might resolve a PUBLISHED package of the same version and measure a release
      # nobody built here. Third-party dependencies still come from nuget.org, which is what a
      # source mapping is for. A job-local packages folder keeps a cached package of the same
      # version from winning.
      - name: Restore the consumer against that feed alone
        working-directory: tests/harness-consumer
        run: |
          cat > nuget.config <<'CONFIG'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="FEED" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Affiant.*" />
              </packageSource>
              <packageSource key="nuget">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          CONFIG
          sed -i "s|FEED|$RUNNER_TEMP/feed|" nuget.config
          dotnet restore -p:AffiantVersion=${{ steps.version.outputs.version }} \
            --packages "$RUNNER_TEMP/packages"

      # The rulebook is the repository's vendored copy, named by absolute path and nowhere near the
      # consumer's output directory. A run that read anything from beside its own assembly would
      # either fail here or quietly measure the wrong document.
      - name: Run the rulebook's suite from the packed package
        working-directory: tests/harness-consumer
        run: |
          dotnet run -c Release --no-restore \
            -p:AffiantVersion=${{ steps.version.outputs.version }} \
            -- "$GITHUB_WORKSPACE/tests/Affiant.Conformance.Tests/protocol"

  # The conformance driver's own gate. It runs the rulebook's promoted fixture suite against the
  # shipped packages and asserts that the set of fixtures that FAIL is exactly the set
  # conformance/parity/dotnet-v0.1.json declares -- failing in either direction, because a check
  # that caught only new failures would let a fix rot unrecorded and the published parity claim
  # would become a document nobody trusts. See Sakwala/affiant-protocol conformance/DRIVER.md §5.
  #
  # It is a separate job from build-and-test on purpose: this one is about a published claim, and a
  # reader of a red run should be able to see which claim broke without reading a test runner's
  # output.
  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # An edited fixture is no longer the document the comparison is about. The vendored suite is
      # checked against the checksums recorded when it was copied from the pinned protocol ref.
      - name: Verify the vendored conformance suite against its checksums
        run: ./conformance/sync.sh --verify

      # The whole solution, not just the driver project: one of the driver's assertions reads the
      # metadata of all TEN shipped assemblies — the executor tripwire is the only IWriteExecutor in
      # any of them (AZ-7) — and five of the ten are not in the driver's own reference graph.
      - name: Build the shipped packages and the conformance driver
        run: dotnet build Affiant.slnx -c Release

      # Running the suite writes conformance/results/dotnet-<version>.json, named for the version
      # the built packages report: the evidence the parity manifest's claim rests on.
      - name: Run the conformance suite against the shipped packages
        run: dotnet test tests/Affiant.Conformance.Tests/Affiant.Conformance.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Assert the failing set equals the parity manifest, exactly
        run: ./conformance/compare-parity.py

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: |
            conformance/results/dotnet-*.json
            conformance/results/ORACLE-RUN-*.md
          if-no-files-found: error
