name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # This step is also the public-API drift gate. Every packable project declares its surface in
      # PublicAPI.Shipped.txt/PublicAPI.Unshipped.txt (Microsoft.CodeAnalysis.PublicApiAnalyzers,
      # wired centrally in Directory.Build.targets); an undeclared public member reports RS0016 and
      # a declared-but-missing one RS0017, both of which fail this build under
      # TreatWarningsAsErrors. See CLAUDE.md, "The public API is declared, not inferred".
      - name: Build framework packages (also enforces public-API baselines)
        run: dotnet build Affiant.slnx -c Release

      - name: Run framework tests
        run: dotnet test Affiant.slnx -c Release --no-build

      - name: Pack framework packages
        run: dotnet pack Affiant.slnx -c Release -o ./nupkgs

      - name: Check 10 packages produced
        run: |
          count=$(ls ./nupkgs/*.nupkg | wc -l)
          echo "Produced $count packages"
          [ "$count" -eq 10 ] || (echo "Expected 10 packages, got $count" && exit 1)
