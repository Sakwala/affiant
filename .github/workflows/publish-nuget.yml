name: Publish NuGet Packages

# Tag-triggered publish ONLY. Branch pushes never publish — this invariant is
# load-bearing: NuGet publishes are irreversible, so only an explicit `v*` tag
# may trigger a release.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    # Trusted Publishing (OIDC): no long-lived NuGet API key is stored anywhere.
    # The job requests a GitHub OIDC token (id-token: write), NuGet/login exchanges
    # it against the nuget.org Trusted Publishing policy for this repo+workflow,
    # and the resulting API key is valid for 1 hour and usable once.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Safety gate: the git tag must match the package version declared in
      # Directory.Build.props (VersionPrefix + VersionSuffix). A wrong-tag publish
      # is unrecoverable on NuGet.org, so fail loudly before building or pushing.
      - name: Assert tag matches package version
        run: |
          version_prefix=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          version_suffix=$(grep -oP '(?<=<VersionSuffix>)[^<]+' Directory.Build.props)
          if [ -n "$version_suffix" ]; then
            pkg_version="${version_prefix}-${version_suffix}"
          else
            pkg_version="${version_prefix}"
          fi
          tag="${GITHUB_REF_NAME}"
          expected="v${pkg_version}"
          echo "Package version (Directory.Build.props): ${pkg_version}"
          echo "Git tag:                                 ${tag}"
          echo "Expected tag:                            ${expected}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Tag '${tag}' does not match package version '${pkg_version}' (expected tag '${expected}'). Refusing to publish — a wrong-tag publish is unrecoverable."
            exit 1
          fi

      - name: Build framework packages
        run: dotnet build Affiant.slnx -c Release

      - name: Run framework tests
        run: dotnet test Affiant.slnx -c Release --no-build

      - name: Pack packages
        run: dotnet pack Affiant.slnx -c Release -o ./nupkgs

      # Placed directly before the push: the temporary key expires after 1 hour,
      # so it must be requested after the (potentially slow) build/test/pack steps.
      # NUGET_USER is a repo Actions secret holding the nuget.org profile name
      # (NOT an email address) that owns the Trusted Publishing policy.
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
